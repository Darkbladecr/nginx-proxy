[core]
  # v3 rejects v2 rule forms like Host(`a`, `b`); keep v2 syntax until the labels are converted
  defaultRuleSyntax = "v2"

[entryPoints.web]
  address = ":80"

[entryPoints.websecure]
  address = ":443"

[providers.swarm]
  exposedByDefault = false
  network = "traefik-proxy"

[providers.file]
  filename = "/etc/traefik/custom.toml"
